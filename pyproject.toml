[tool.poetry]
name = "bcf-api-xml"
version = "0.4.20"
description = "Convert BCF-API to BCF-XML"
authors = ["Hugo Duroux <hugo@bimdata.io>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/bimdata/BCF-API-XML-translator"
repository = "https://github.com/bimdata/BCF-API-XML-translator"

[tool.poetry.dependencies]
python = "^3.10"
lxml = "^6.1.2"
generateDS = "^2.35.13"
python-dateutil = "^2.8.0"
xlsxwriter = "^3.2.9"
pillow = "^12.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
black = "^26.5.1"
pre-commit = "^4.6.2"
reorder-python-imports = "^3.17.0"
pyflakes = "^3.4.0"
pycodestyle = "^2.14.0"


[tool.black]
line-length = 95
[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
